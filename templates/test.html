  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Independent Scroll</title>
  <style>
    .container {
      display: flex;
      gap: 20px; /* spacing between divs */
    }

    .scroll-box {
      background: yellowgreen;
      width: 200px;
      height: 150px; /* fixed height */
      border: 1px solid #333;
      overflow-y: auto; /* enables vertical scroll */
      padding: 10px;
    }

    .scroll-quad {
      background: yellow;
      width: 200px;
      height: 150px; /* fixed height */
      border: 1px solid #333;
      overflow-y: auto; /* enables vertical scroll */
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scroll-box">
      <p>Div 1 content line 1</p>
      <p>Div 1 content line 2</p>
      <p>Div 1 content line 3</p>
      <p>Div 1 content line 4</p>
      <p>Div 1 content line 5</p>
      <p>Div 1 content line 6</p>
    </div>

    <div class="scroll-quad">
      <p>Div 2 content line 1</p>
      <p>Div 2 content line 2</p>
      <p>Div 2 content line 3</p>
      <p>Div 2 content line 4</p>
      <p>Div 2 content line 5</p>
      <p>Div 2 content line 6</p>
    </div>
  </div>
</body>
</html>

</div>
