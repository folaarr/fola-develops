{% extends "base.html" %}

{% block title %}| Projects{% endblock %}

{% block head %}
    <style>
        body {
            box-sizing: border-box;
        }

        div.projects-div::before {
            content: "background placeholder";
            color: transparent;
            background-image: url("{{ url_for('static', filename='images/colors.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: fixed;
            top: 0;
            min-height: 100vh;
            min-width: 100vw;
            z-index: -1;
            filter: brightness(0.2);
        }

        div.projects-div {
            min-height: 100vh;
        }

        div.projects-div {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
{% endblock %}

{% block body %}
    <div class="projects-div">
        <div class="projects-holder">
            <a class="text picture-button account-project project-project" href="{{ url_for('professional') }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart4 testify-svg" viewBox="0 0 16 16">
                    <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v1.384l7.614 2.03a1.5 1.5 0 0 0 .772 0L16 5.884V4.5A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5"/>
                    <path d="M0 12.5A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5V6.85L8.129 8.947a.5.5 0 0 1-.258 0L0 6.85z"/>
                </svg><p class="picture-prompt">  Professional Projects</p>
            </a>
            <a class="text picture-button account-project project-project" href="{{ url_for('designs') }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart4 testify-svg" viewBox="0 0 16 16">
                    <path d="M12.433 10.07C14.133 10.585 16 11.15 16 8a8 8 0 1 0-8 8c1.996 0 1.826-1.504 1.649-3.08-.124-1.101-.252-2.237.351-2.92.465-.527 1.42-.237 2.433.07M8 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m4.5 3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3M5 6.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m.5 6.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                </svg><p class="picture-prompt">  Personal Projects</p>
            </a>
        </div>
    </div>
{% endblock %}
