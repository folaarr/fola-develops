{% extends "base.html" %}

{% block head %}
    <style>
        body {
            box-sizing: border-box;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        div.hero-prompt::before {
            content: "Hero";
            color: transparent;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.2);
            min-width: 100vw;
            min-height: 100vh;
            z-index: -1;
            position: fixed;
            top: 0;
            left: 0;
        }

        @media (orientation: portrait) {
            div.hero-prompt::before {
                background-image: url("{{ url_for('static', filename='images/follavatar-portrait.jpg') }}");
            }
        }

        @media (orientation: landscape) {
            div.hero-prompt::before {
                background-image: url("{{ url_for('static', filename='images/follavatar-landscape.jpg') }}");
            }
        }


    </style>
{% endblock %}
