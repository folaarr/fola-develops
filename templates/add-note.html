{% extends "user_base.html" %}

{% block user_title %}Add Testimony{% endblock %}

{% block user_body %}
    <h2 class="text add-title">Add a note</h2>
    <div class="add-card">
        <div class="add-form">
            <form action="{{ url_for('add_testimony') }}" method="post" novalidate>
                {{ form.csrf_token }}
                {{ form.testimony.label }}<br>
                {{ form.testimony() }}<br>
                {% for error in form.testimony.errors %}
                <p class="text add-instruction">{{ error }}</p>
                {% endfor %}
                {{ form.button() }}
            </form>
        </div>
    </div>
{% endblock %}
